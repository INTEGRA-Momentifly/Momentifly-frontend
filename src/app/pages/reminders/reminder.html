<div>
  <h1 id="title1">Remindere</h1>
  <section class="reminders-page">

    <!-- SECȚIUNEA EXISTENTĂ PENTRU REMINDERE -->
    <div class="page-header">
      <h2 id="title2">Remindere</h2>
      <div class="header-actions">
        <span class="active-count">{{ activeReminderCount }} ACTIVE</span>
        <button pButton type="button" class="add-button" (click)="showDialog()">
          <i class="pi pi-plus"></i> Adaugă
        </button>
      </div>
    </div>

    <div class="title">
      <p>REMINDER</p>
      <div class="header-right">
        <p>RECURENȚĂ</p>
        <p>URMĂTOAREA DATĂ</p>
      </div>
    </div>

    <app-reminder-list
      [reminders]="reminders()"
      [loading]="loading()"
    />
  </section>

  <!-- Componenta existentă pentru Adăugare Reminder -->
  <app-add-reminder
    [displayModal]="displayAddModal()"
    (closeModal)="hideDialog()"
    (reminderAdded)="onReminderAdded($event)">
  </app-add-reminder>

</div>
