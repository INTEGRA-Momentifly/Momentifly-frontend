<div class="subscription-page-container">
  <header class="subscription-page-header">
    <h1>Abonamente</h1>

    <button
      pButton
      type="button"
      class="p-button-add-subscription"
      (click)="showCreateSubscriptionPopup = true">
      <i class="pi pi-plus" aria-hidden="true"></i>
      <span>Adaugă</span>
    </button>
  </header>
  <div class="active-subscriptions-header">
    <h2>@switch (selectedFilter()) {
      @case ('ACTIVE') {
        Abonamente active
      }
      @case ('EXPIRED') {
        Abonamente expirate
      }
      @default {
        Toate abonamentele
      }
    }</h2>
  </div>

  @if (showCreateSubscriptionPopup) {
    <app-create-subscription
      [userId]="currentUserId()"
      (close)="showCreateSubscriptionPopup = false"
      (subscriptionCreated)="onSubscriptionCreated()">
    </app-create-subscription>
  }

  <main class="subscription-page-content">
    <app-subscription-list [subscriptions]="subscriptions()"
                           [activeFilter]="selectedFilter()"
                           (filterChange)="onFilterChange($event)"
                           (toggleAutoRenewal)="onToggleAutoRenewal($event)"
    />
  </main>
</div>

<app-reminders></app-reminders>
