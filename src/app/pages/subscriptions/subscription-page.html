<div class="subscription-page-container">
  <header class="subscription-page-header">
    <h1>Abonamente</h1>
  </header>

  <div class="active-subscriptions-header">
    <h2>Abonamente active</h2>
    <button pButton type="button" class="add-button" (click)="showCreateSubscriptionPopup = true">
      <i class="pi pi-plus"></i> Adaugă Abonament
    </button>
  </div>

  @if(showCreateSubscriptionPopup) {
    <app-create-subscription
      (close)="showCreateSubscriptionPopup = false"
      (subscriptionCreated)="onSubscriptionCreated()">
    </app-create-subscription>
  }

  <!-- Lista de abonamente -->
  <main class="subscription-page-content">
    <app-subscription-list [subscriptions]="subscriptions()"></app-subscription-list>
  </main>
</div>

<app-reminders></app-reminders>
