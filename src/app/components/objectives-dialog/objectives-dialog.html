<div class="backdrop" (pointerdown)="onBackdropPointerDown($event)" (click)="onBackdropClick($event)">
  <div
    #panel
    class="panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="objectives-dialog-title"
    tabindex="-1"
  >
    <header class="panel-header">
      <div>
        <h2 id="objectives-dialog-title" class="panel-title">Editează obiectivele</h2>
        <p class="panel-subtitle">Ajustează ținta ta zilnică de calorii și macronutrienți</p>
      </div>
      <button type="button" class="close-button" aria-label="Închide" (click)="requestClose()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <app-objectives-form
      variant="edit"
      [initialValues]="initialValues()"
      [submitting]="submitting()"
      [error]="error()"
      (submitted)="submitted.emit($event)"
      (cancelled)="requestClose()"
    />
  </div>
</div>
