<section class="quests-card">
  <header class="quests-header">
    <h2>Quests zilnice</h2>
    <svg
      class="trophy"
      [class.active]="allDone()"
      viewBox="0 0 24 24"
      width="22"
      height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 4h8v5a4 4 0 0 1-8 0V4Z" />
      <path d="M8 6H5a1 1 0 0 0-1 1 3 3 0 0 0 3 3h1" />
      <path d="M16 6h3a1 1 0 0 1 1 1 3 3 0 0 1-3 3h-1" />
      <path d="M12 13v4M9 20h6M10 17h4" />
    </svg>
  </header>

  <div class="progress-meta">
    <span class="meta">{{ completedCount() }} / {{ quests().length }} completate</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" [style.width.%]="progress()"></div>
  </div>

  <ul class="quest-list">
    @for (quest of quests(); track quest.id) {
      <li class="quest-row" [class.done]="isDone(quest.id)">
        <button
          type="button"
          class="check"
          [class.checked]="isDone(quest.id)"
          (click)="toggle(quest.id)"
          [attr.aria-pressed]="isDone(quest.id)"
          aria-label="Marchează quest-ul"
        ></button>
        <span class="description">{{ quest.description }}</span>
        <span class="points">{{ quest.points }} pts</span>
      </li>
    } @empty {
      <li class="empty">Nu ai quests pentru azi.</li>
    }
  </ul>
</section>
