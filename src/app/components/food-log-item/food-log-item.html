<div class="food-item">

  <!-- Left: Description -->
  <div class="food-details">
    <span class="food-name">{{ foodLog.description }}</span>
  </div>

  <!-- Right: Macros -->
  <div class="food-nutrients">
    <span class="macro">P: {{ foodLog.proteins }}</span>
    <span class="macro">C: {{ foodLog.carbs }}</span>
    <span class="macro">G: {{ foodLog.fats }}</span>
    <span class="calories"><strong>{{ foodLog.calories }}</strong> kcal</span>
  </div>
</div>
