<div class="app-shell">
  <p-sidebar class="global-sidebar" [open]="true" variant="sidebar" width="13.75rem">
    <aside class="sidebar">
      <div class="brand">Momentifly</div>

      <nav class="main-nav" aria-label="Main navigation">
        <button
          pButton
          type="button"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-button"
        >
          <i class="pi pi-th-large nav-icon" aria-hidden="true"></i>Dashboard
        </button>
        <button
          pButton
          type="button"
          routerLink="/tasks"
          routerLinkActive="active"
          class="nav-button"
        >
          <i class="pi pi-check-square nav-icon" aria-hidden="true"></i>Tasks
        </button>
        <button pButton type="button" class="nav-button">
          <i class="pi pi-calendar nav-icon" aria-hidden="true"></i>Calendar
        </button>
        <button pButton type="button" class="nav-button">
          <i class="pi pi-sync nav-icon" aria-hidden="true"></i>Fitness
        </button>
        <button pButton type="button" class="nav-button">
          <i class="pi pi-clock nav-icon" aria-hidden="true"></i>Subscriptions
        </button>
        <button pButton type="button" class="nav-button">
          <i class="pi pi-share-alt nav-icon" aria-hidden="true"></i>Social
        </button>
      </nav>

      <button pButton class="settings-link" type="button">
        <i class="pi pi-cog nav-icon" aria-hidden="true"></i>Settings
      </button>
    </aside>
  </p-sidebar>

  <main class="page-content">
    <router-outlet />
  </main>
</div>
